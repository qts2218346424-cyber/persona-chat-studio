server {
    listen 80;
    listen 443 ssl http2;
    server_name star.claudexxb.online rp.claudexxb.online;

    ssl_certificate /etc/nginx/ssl_star_claudexxb.crt;
    ssl_certificate_key /etc/nginx/ssl_star_claudexxb.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 25M;
    charset utf-8;

    # Gzip 传输压缩与预压缩（优先发送 .gz 预压缩静态文件，零消耗 CPU）
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        font/woff
        font/woff2
        application/wasm;

    # 1. API 网关热重启瞬时 JSON 兜底
    location = /_star_api_fallback.json {
        internal;
        default_type application/json;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Retry-After "3" always;
        return 503 '{"error":"星语恋庭服务正在瞬时热更新中，请稍候数秒自动恢复","code":"GATEWAY_RECONNECTING","retryAfter":3}';
    }

    # 2. Service Worker 线程脚本（严格免缓存，保证最新生命周期控制）
    location = /sw.js {
        root /opt/star-whisper/public;
        try_files /sw.js @star_backend;
        sendfile on;
        tcp_nodelay on;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 3. 根 HTML 页面（协商缓存，版本变更用户刷新立即生效）
    location = / {
        root /opt/star-whisper/public;
        try_files /index.html @star_backend;
        sendfile on;
        tcp_nodelay on;
        gzip_static on;
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /index.html {
        root /opt/star-whisper/public;
        try_files /index.html @star_backend;
        sendfile on;
        tcp_nodelay on;
        gzip_static on;
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 4. 前端静态资源（JS/CSS/字体/图标等），Nginx 内核零拷贝直出 + 30天强缓存（Cloudflare 边缘 CDN 极速命中）
    location ~* \.(js|css|svg|png|jpg|jpeg|webp|ico|woff|woff2|ttf|map)$ {
        root /opt/star-whisper/public;
        try_files $uri @star_backend;
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        gzip_static on;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 5. 伴侣立绘、图标与示例音频（assets 目录）
    location /assets/ {
        root /opt/star-whisper/public;
        try_files $uri @star_backend;
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        gzip_static on;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # 6. Android 随身版 APK 安装包内核级零拷贝直出（不占用 Node 内存）
    location /downloads/ {
        root /opt/star-whisper/public;
        gzip off;
        sendfile on;
        sendfile_max_chunk 1m;
        tcp_nopush on;
        autoindex off;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # 7. API 与 SSE 流式对话反向代理（强制关闭缓冲确保逐字丝滑输出）
    location /api/ {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_connect_timeout 5s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        proxy_intercept_errors on;
        error_page 502 503 504 =503 /_star_api_fallback.json;
    }

    # 8. 前端其他动态路由回退
    location / {
        root /opt/star-whisper/public;
        try_files $uri $uri/ @star_backend;
    }

    location @star_backend {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
