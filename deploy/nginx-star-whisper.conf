server {
    listen 80;
    listen 443 ssl;
    server_name star.claudexxb.online rp.claudexxb.online;

    ssl_certificate /etc/nginx/ssl_star_claudexxb.crt;
    ssl_certificate_key /etc/nginx/ssl_star_claudexxb.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 25M;
    charset utf-8;

    # Gzip 传输压缩（JS/CSS/HTML/JSON 体积缩减 75%+，自动豁免 SSE 流式响应）
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # 1. API 网关热重启瞬时 JSON 兜底
    location = /_star_api_fallback.json {
        internal;
        default_type application/json;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Retry-After "3" always;
        return 503 '{"error":"星语恋庭服务正在瞬时热更新中，请稍候数秒自动恢复","code":"GATEWAY_RECONNECTING","retryAfter":3}';
    }

    # 2. 伴侣立绘、图标与示例音频由 Nginx 内核零拷贝直出（强缓存节省小带宽）
    location /assets/ {
        root /opt/star-whisper/public;
        try_files $uri @star_backend;
        sendfile on;
        tcp_nopush on;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 3. Android 随身版 APK 安装包内核级零拷贝直出（不占用 Node 内存）
    location /downloads/ {
        root /opt/star-whisper/public;
        gzip off;
        sendfile on;
        sendfile_max_chunk 1m;
        tcp_nopush on;
        autoindex off;
        add_header Cache-Control "public, max-age=86400";
    }

    # 4. API 与 SSE 流式对话反向代理（强制关闭缓冲确保逐字丝滑输出）
    location /api/ {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_connect_timeout 5s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        proxy_intercept_errors on;
        error_page 502 503 504 =503 /_star_api_fallback.json;
    }

    # 5. 前端主应用与资源路由
    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location @star_backend {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }
}
